<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heffner Family Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="index.html">Heffner Family Archive</a>
      <a href="info.html" class="topbar-info-logo" aria-label="Info"><img class="hfa-logo hfa-logo--topbar" src="hfalogo.png" width="1739" height="1276" alt=""></a>
    </header>
    <div class="title2"> 
        <h1> 002 GRANDPA</h1>
    </div>
    <section class="archive-grid">
      <div class="column">
        <figure class="piece"><div class="swatch s1 swatch-pop"><img src="pop.png" alt=""><a class="swatch-hover-more" href="clericalcollar.html"><span class="swatch-hover-more-inner"> CLERICAL COLLAR <br> <span class="number">2026.002.01</span></a></div></figure>
      </div>

      <div class="column">
        <figure class="piece"><div class="swatch s5 swatch-pop"><img src="stripes.png" alt=""><a class="swatch-hover-more" href="nana.html"><span class="swatch-hover-more-inner">FAMILY DINNER<br> <span class="number">2026.003.02</span></a></div></figure>
      </div>

      <div class="column">
        <figure class="piece"><div class="swatch s5 swatch-pop"><img src="stripes.png" alt=""><a class="swatch-hover-more" href="pop.html"><span class="swatch-hover-more-inner">FAMILY DINNER<br> <span class="number">2026.001.02</span></a></div></figure>
  <script>
    const hoverTags = document.querySelectorAll(".swatch-hover-more-inner");
    hoverTags.forEach((tag) => {
      const angle = (Math.random() * 8 - 4).toFixed(2);
      const offsetX = (Math.random() * 12 - 6).toFixed(1);
      const offsetY = (Math.random() * 8 - 4).toFixed(1);
      tag.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${angle}deg)`;
    });
  </script>
</body>
</html>
