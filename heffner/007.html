<!DOCTYPE html>

<body>

    <section class="archive-grid">
      <!-- Columns ordered so rows read left-to-right in catalog order: 003.00, 003.08, 005.01 … 005.09, then unnumbered -->
      <div class="column">
        <figure class="piece"><div class="swatch s1 swatch-pop"><img src="mamawatch.png" alt=""><a class="swatch-hover-more" href="mamawatch.html"><span class="swatch-hover-more-inner">MAMA WATCH! <br> <span class="number">2026.008.01</span></a></div></figure>
        
      </div>

      <!--<div class="column">
        <figure class="piece"><div class="swatch s5 swatch-pop"><img src="stripes.png" alt=""><a class="swatch-hover-more" href="nana.html"><span class="swatch-hover-more-inner">FAMILY DINNER<br> <span class="number">2026.005.02</span></a></div></figure>
      </div>

      <div class="column">
        <figure class="piece"><div class="swatch s5 swatch-pop"><img src="dots.png" alt=""><a class="swatch-hover-more" href="polkadottie.html"><span class="swatch-hover-more-inner">DAD'S TIE<br> <span class="number">2026.005.03</span></a></div></figure>
      </div>
    </section>-->
  </main>
  <script>
    const hoverTags = document.querySelectorAll(".swatch-hover-more-inner");
    hoverTags.forEach((tag) => {
      const angle = (Math.random() * 8 - 4).toFixed(2);
      const offsetX = (Math.random() * 12 - 6).toFixed(1);
      const offsetY = (Math.random() * 8 - 4).toFixed(1);
      tag.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${angle}deg)`;
    });
  </script>
</body>
