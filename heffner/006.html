<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heffner Family Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="index.html">Heffner Family Archive</a>
      <a href="info.html">Info</a>
    </header>
    <div class="title2"> 
        <h1> AUNTIE MARIA</h1>
    </div>
    <section class="archive-grid">
      <div class="column">
        <figure class="piece"><div class="swatch s1 swatch-pop"><img src="auntiemaria.png" alt=""><a class="swatch-hover-more" href="auntiemariasvest.html"><span class="swatch-hover-more-inner">AUNTIE MARIA'S VEST <br> <span class="number">2026.006.01</span></a></div></figure>
      </div>
      <div class="column">
        <figure class="piece"><div class="swatch s11 swatch-pop"><img src="auntiemaria2.png" alt=""><a class="swatch-hover-more" href="favoritesuit.html"><span class="swatch-hover-more-inner">FAVORITE SUIT<br> <span class="number">2026.006.02</span></a></div></figure>
      </div>
      <div class="column">
        <figure class="piece"><div class="swatch s8 swatch-pop"><img src="street.png" alt=""><a class="swatch-hover-more" href="busystreet.html"><span class="swatch-hover-more-inner">A VERY BUSY STREET<br> <span class="number">2026.006.03</span></a></div></figure>
      </div>
      <div class="column">
       <figure class="piece"><div class="swatch s12 swatch-pop"><img src="collar.png" alt=""><a class="swatch-hover-more" href="collar.html"><span class="swatch-hover-more-inner">COLLAR<br><span class="number">2026.006.04</span></a></div></figure>
      </div>
    </section>
  </main>
  <script>
    const hoverTags = document.querySelectorAll(".swatch-hover-more-inner");
    hoverTags.forEach((tag) => {
      const angle = (Math.random() * 8 - 4).toFixed(2);
      const offsetX = (Math.random() * 12 - 6).toFixed(1);
      const offsetY = (Math.random() * 8 - 4).toFixed(1);
      tag.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${angle}deg)`;
    });
  </script>
</body>
</html>
